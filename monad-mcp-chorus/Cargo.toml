[package]
name = "monad-mcp-chorus"
version = "0.1.0"
edition = "2024"

# criterion takes its own command line options
[lib]
bench = false

[features]
# exposes the stub instantiation (crate::stub).
enable_stub = []

[dependencies]
alloy-rlp = { workspace = true, features = ["derive"] }
arrayvec = { workspace = true }
bytes = { workspace = true }
derive_more = { workspace = true, features = ["from", "sum", "add", "into"] }
hex = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tiny-keccak = { workspace = true, features = ["keccak"] }
tracing = { workspace = true }

monad-mcp-common = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
libc = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
proptest = { workspace = true }
rand = { workspace = true }
tempfile = { workspace = true }
tracing-test = { workspace = true }

[[bench]]
name = "tally"
harness = false
required-features = ["enable_stub"]

[lints.clippy]
# outputs must not depend on hash order; see monad-mcp-node/docs/determinism.md
iter_over_hash_type = "deny"
# std hash containers only through the named types in clippy.toml
disallowed_types = "deny"
