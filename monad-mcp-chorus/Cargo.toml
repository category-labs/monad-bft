[package]
name = "monad-mcp-chorus"
version = "0.1.0"
edition = "2024"

[features]
# exposes the stub instantiation (crate::stub).
enable_stub = []

[dependencies]
bytes = { workspace = true }
derive_more = { workspace = true, features = ["from", "sum", "add", "into"] }
