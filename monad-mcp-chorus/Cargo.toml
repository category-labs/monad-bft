[package]
name = "monad-mcp-chorus"
version = "0.1.0"
edition = "2024"

[features]
# exposes the stub instantiation (crate::stub).
enable_stub = []

[dependencies]
alloy-rlp = { workspace = true, features = ["derive"] }
arrayvec = { workspace = true }
bytes = { workspace = true }
derive_more = { workspace = true, features = ["from", "sum", "add", "into"] }
hex = { workspace = true }
indexmap = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tiny-keccak = { workspace = true, features = ["keccak"] }
tracing = { workspace = true }

monad-mcp-common = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
libc = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
rand = { workspace = true }
tempfile = { workspace = true }
tracing-test = { workspace = true }

[lints.clippy]
# outputs must not depend on hash order; see monad-mcp-node/docs/determinism.md
iter_over_hash_type = "deny"
