[package]
name = "monad-mcp-cadence"
version = "0.1.0"
edition = "2024"

# criterion takes its own command line options
[lib]
bench = false

[features]
# exposes the stub instantiation (crate::stub).
enable_stub = ["monad-mcp-epoch/enable_stub"]
# adds the hollow scheme to the stub, for the nodes of one process.
enable_hollow = ["enable_stub"]

[dependencies]
alloy-rlp = { workspace = true, features = ["derive"] }
arrayvec = { workspace = true }
bytes = { workspace = true }
derive_more = { workspace = true, features = ["from", "sum", "add", "into"] }
hex = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

monad-mcp-common = { workspace = true }
monad-mcp-epoch = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
rand = { workspace = true }
tracing-test = { workspace = true }

[[bench]]
name = "tally"
harness = false
required-features = ["enable_stub"]

[lints.clippy]
# outputs must not depend on hash order; see monad-mcp-node/docs/determinism.md
iter_over_hash_type = "deny"
