[package]
name = "monad-mcp-node"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "monad-mcp-node"
path = "src/main.rs"
# remove the stub feature after prod env exists
required-features = ["enable_stub"]

[features]
enable_stub = ["monad-mcp-cadence/enable_stub", "monad-mcp-da/enable_stub"]
# a node that speaks the hollow scheme, for a network inside one process.
enable_hollow = ["enable_stub", "monad-mcp-cadence/enable_hollow", "monad-mcp-da/enable_hollow"]

[dependencies]
alloy-rlp = { workspace = true, features = ["derive"] }
bytes = { workspace = true }
rand = { workspace = true }
rand_chacha = { workspace = true }
serde = { workspace = true, features = ["derive"] }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "time", "signal"] }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

monad-mcp-cadence = { workspace = true }
monad-mcp-common = { workspace = true }
monad-mcp-da = { workspace = true }

[dev-dependencies]
# turns on enable_stub and enable_hollow for the tests and examples
monad-mcp-node = { path = ".", features = ["enable_stub", "enable_hollow"] }
monad-sim = { workspace = true }
monad-sim-swarm = { workspace = true }
rapidhash = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }

[lints.clippy]
# outputs must not depend on hash order; see monad-mcp-node/docs/determinism.md
iter_over_hash_type = "deny"
