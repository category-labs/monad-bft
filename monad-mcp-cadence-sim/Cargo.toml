[package]
name = "monad-mcp-cadence-sim"
version = "0.1.0"
edition = "2024"

[dependencies]
bytes = { workspace = true }
monad-mcp-cadence = { workspace = true, features = ["enable_stub"] }
monad-mcp-common = { workspace = true }
monad-sim = { workspace = true }
monad-sim-swarm = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
alloy-rlp = { workspace = true }

[lints.clippy]
# outputs must not depend on hash order; see monad-mcp-node/docs/determinism.md
iter_over_hash_type = "deny"
