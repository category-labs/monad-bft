[package]
name = "monad-rpc-domain"
description = "JSON-RPC API server of a Monad private domain"
version = "0.1.0"
edition = "2021"

[dependencies]
monad-chain-config = { workspace = true }
monad-ethcall = { workspace = true }
monad-rpc = { workspace = true }
monad-triedb-utils = { workspace = true }

actix-web = { workspace = true }
alloy-consensus = { workspace = true }
alloy-primitives = { workspace = true, features = ["k256"] }
alloy-rpc-types = { workspace = true }
alloy-sol-types = { workspace = true }
bytes = { workspace = true }
clap = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["raw_value"] }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tracing = { workspace = true }
tracing-actix-web = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "json"] }

[dev-dependencies]
monad-eth-testutil = { workspace = true }
monad-eth-types = { workspace = true }
monad-types = { workspace = true }

alloy-signer = { workspace = true }
alloy-signer-local = { workspace = true }
