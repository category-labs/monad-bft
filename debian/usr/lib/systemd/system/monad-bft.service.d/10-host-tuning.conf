# Default host tuning. Override per host with a drop-in in
# /etc/systemd/system/monad-bft.service.d/ — clear list settings first, e.g.:
#   [Service]
#   CPUAffinity=
#   CPUAffinity=16,17,18,19
[Service]
AllowedCPUs=8-11
CPUAffinity=8,9,10,11
Environment="RUST_LOG=debug,h2=warn,tower=warn,opentelemetry_sdk=warn,opentelemetry-otlp=warn"
